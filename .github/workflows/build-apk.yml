name: Build Fikra Pro Installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inspect Android manifests
        run: |
          find android -name AndroidManifest.xml \
            -print -exec cat {} \;

      - name: Search project for old embedding
        run: |
          grep -R -n -E \
            'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(' \
            android lib pubspec.yaml pubspec.lock || true

      - name: Clean build cache
        run: flutter clean

      - name: Build debug APK
        run: flutter build apk --debug -v

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fikra-Pro-Installable-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
